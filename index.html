<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="description" content="Online player for ZX Spectrum AY music files (PT3, VT2, PSG, FYM, STC, MTC) with playlist, waveform visualization, and favorites.">
    <meta name="keywords" content="ZX Spectrum, AY, YM, PT3, VT2, PSG, FYM, STC, MTC, Sound Tracker, chiptune, music player, retro, 8-bit">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="AY Player — ZX Spectrum AY Music Player (PT3, VT2, PSG, FYM, STC, MTC)">
    <meta property="og:description" content="Online player for ZX Spectrum AY music files (PT3, VT2, PSG, FYM, STC, MTC).">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ayplay.ru/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="AY Player — ZX Spectrum AY Music Player">
    <meta name="twitter:description" content="Online player for ZX Spectrum AY music files (PT3, VT2, PSG, FYM, STC, MTC).">
    <link rel="canonical" href="https://ayplay.ru/">
    <link rel="icon" type="image/svg+xml" href="logo_ayplay.svg">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="player/ayPlayer.css?v=312">
</head>
    <body>
    <div id="player"></div>
    <div id="countryFlags" style="text-align:left;font-size:0;max-width:1024px;margin-left:auto;margin-right:auto;padding:6px 0 16px 8px;width:100%;"></div>

    <script src="player/pako_inflate.min.js?v=16"></script>
    <script src="player/ayumi.js?v=17"></script>
    <script src="player/opn.js?v=1"></script>
    <script src="player/fym.js?v=16"></script>
    <script src="player/pt3.js?v=16"></script>
    <script src="player/vt2.js?v=12"></script>
    <script src="player/psg.js?v=1"></script>
    <script src="player/snd2psg.js?v=2"></script>
    <script src="player/stc.js?v=3"></script>
    <script src="player/pt2.js?v=1"></script>
    <script src="player/asc.js?v=1"></script>
    <script src="player/tfc.js?v=1"></script>
    <script src="player/stp.js?v=1"></script>
    <script src="player/pt1.js?v=1"></script>
    <script src="player/aym_reader.js?v=5"></script>
    <script src="player/z80core.js?v=5"></script>
    <script src="player/ay.js?v=4"></script>
    <script src="player/ayPlayer.js?v=324"></script>
    <script>
        var LS_KEY = 'ayPlayer_playlist';
        var LS_TIME = 'ayPlayer_playlist_time';
        var CACHE_MAX_AGE = 86400000;
        var COUNTER_KEY = 'ayPlayer_counter_time';
        var COUNTER_MAX_AGE = 86400000;

        var player = AYPlayer.init('player')
            .onTrackChange(function(info) {
                document.title = 'AY Player';
            });

        function loadPlaylist(playlist) {
            if (playlist.length === 0) {
                document.querySelector('.ayPlayer-trackName').textContent = 'Нет файлов в chiptunes/';
                return;
            }
            player.setPlaylist(playlist);
            player.tryPlayTrackFromUrl();
        }

        function showPlaylistError() {
            document.getElementById('player_playlistItems').innerHTML =
                '<div style="padding:12px;color:#a04040;font-style:italic;">Run: node scripts/generate-m3u-playlist.js</div>';
        }

        function updatePlaylistFromServer(isBackground) {
            fetch('api/playlist.php?action=all')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.entries) {
                        localStorage.setItem(LS_KEY, JSON.stringify(data.entries));
                        localStorage.setItem(LS_TIME, Date.now());
                        if (!isBackground) loadPlaylist(data.entries);
                    } else if (!isBackground) {
                        showPlaylistError();
                    }
                })
                .catch(function(err) {
                    console.error('Failed to load playlist:', err);
                    if (!isBackground) showPlaylistError();
                });
        }

        document.getElementById('player_playlistItems').innerHTML =
            '<div style="padding:12px;color:#007890;font-style:italic;">Loading playlist\u2026</div>';

        var cachedStr = localStorage.getItem(LS_KEY);
        var cachedTime = localStorage.getItem(LS_TIME);
        var usedCache = false;
        if (cachedStr && cachedTime && Date.now() - +cachedTime < CACHE_MAX_AGE) {
            try {
                loadPlaylist(JSON.parse(cachedStr));
                usedCache = true;
            } catch(e) {}
        }
        updatePlaylistFromServer(usedCache);

        try {
            var vc = localStorage.getItem('ayPlayer_visits') || 0;
            localStorage.setItem('ayPlayer_visits', ++vc);
        } catch(e) {}

        var flagsEl = document.getElementById('countryFlags');
        var state = {visitCount: 0, flagsHtml: ''};

        loadStats();

        function loadStats() {
            try {
                var counterTime = localStorage.getItem(COUNTER_KEY);
                var counterUrl = counterTime && Date.now() - +counterTime < COUNTER_MAX_AGE ? 'api/flags.php' : 'api/counter.php';
                fetch(counterUrl).then(function(r){return r.json();}).then(function(d){
                    if (counterUrl === 'api/counter.php') localStorage.setItem(COUNTER_KEY, Date.now());
                    state.visitCount = d.count || 0;
                    renderFlags();
                }).catch(function(){renderFlags();});
            } catch(e) { renderFlags(); }
        }

        function renderFlags() {
            if (!flagsEl) return;
            var html = '<span style="font-size:12px;font-family:sans-serif;color:#003850;">Visit counter: ' + state.visitCount + '</span>';
            flagsEl.innerHTML = html;
        }
    </script>
</body>
</html>
